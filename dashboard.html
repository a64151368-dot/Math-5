html,body{margin:0;background:#cfe0e0;overflow:hidden;height:100%}
.stage{width:1920px;height:1080px;transform-origin:0 0}
body{margin:0}
a{color:#3b2a1a}a:hover{color:#c2410c}
@keyframes sway{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}
@keyframes ring{0%{transform:scale(0.9);opacity:0.7}100%{transform:scale(1.25);opacity:0}}
.route{display:block;text-decoration:none;cursor:pointer}
.route .tag{animation:sway 4s ease-in-out infinite;transform-origin:50% 0;transition:transform .2s}
.route:hover .tag,.route:focus-visible .tag{animation-play-state:paused;transform:scale(1.06)}
.route .halo{animation:ring 2.4s ease-out infinite}
.route:focus-visible{outline:4px solid #1d4ea0;outline-offset:6px;border-radius:24px}
@keyframes fl{0%,100%{transform:translate(0,0) rotate(0)}25%{transform:translate(26px,-16px) rotate(4deg)}50%{transform:translate(52px,0) rotate(0)}75%{transform:translate(26px,16px) rotate(-4deg)}}
@keyframes cl{from{transform:translateX(-300px)}to{transform:translateX(1940px)}}
@keyframes lane{0%,40%{transform:translateY(0);animation-timing-function:ease-in-out}54%,96%{transform:translateY(var(--dy));animation-timing-function:ease-in-out}100%{transform:translateY(0)}}
@keyframes puff{0%,100%{transform:translateY(0) rotate(-5deg) scale(1)}33%{transform:translateY(-10px) rotate(2deg) scale(1.04)}66%{transform:translateY(6px) rotate(5deg) scale(0.98)}}
.fl{animation:fl 12s ease-in-out infinite}
.cl{animation:cl 100s linear infinite;will-change:transform}
.lane{animation:lane 100s linear infinite}
.puff{animation:puff 6s ease-in-out infinite}
@media (prefers-reduced-motion: reduce){.route .tag,.fl,.cl,.lane,.puff{animation:none}}
@keyframes dance{0%,100%{transform:rotate(-10deg) translateY(0)}50%{transform:rotate(10deg) translateY(-4px)}}
.dance{animation:dance .8s ease-in-out infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes sunbob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.sunbtn{animation:sunbob 4s ease-in-out infinite;transition:filter .2s}
.sunbtn:hover{filter:brightness(1.08)}
.sunbtn:focus-visible{outline:4px solid #1d4ea0;outline-offset:4px;border-radius:24px}
.sunbtn .rays{transform-box:view-box;transform-origin:100px 100px}
.sunbtn.on .rays{animation:spin 14s linear infinite}
.sunbtn .eyes-open{display:none}
.sunbtn.on .eyes-open{display:inline}
.sunbtn.on .eyes-sleep{display:none}
@media (prefers-reduced-motion: reduce){.sunbtn,.sunbtn.on .rays{animation:none}}
@keyframes fly{0%,100%{transform:translate(0,0) rotate(-2deg)}25%{transform:translate(70px,-34px) rotate(3deg)}50%{transform:translate(20px,-10px) rotate(-1deg)}75%{transform:translate(-50px,18px) rotate(2deg)}}
@keyframes flap{0%,100%{transform:rotate(18deg)}50%{transform:rotate(-26deg)}}
@keyframes flapb{0%,100%{transform:rotate(10deg)}50%{transform:rotate(-18deg)}}
@keyframes scarf{0%,100%{transform:skewY(0) scaleX(1)}50%{transform:skewY(-6deg) scaleX(1.06)}}
@keyframes eyes{0%,62%,90%,100%{transform:scale(1)}70%,84%{transform:scale(1.35)}}
@keyframes brows{0%,62%,90%,100%{transform:translateY(0)}70%,84%{transform:translateY(-7px)}}
@keyframes beak{0%,62%,90%,100%{transform:rotate(0)}70%,84%{transform:rotate(16deg)}}
@keyframes bang{0%,64%,92%,100%{opacity:0;transform:scale(0.4)}72%{opacity:1;transform:scale(1.15)}76%,86%{opacity:1;transform:scale(1)}}
.fly{animation:fly 14s ease-in-out infinite}
.fly .wing{transform-box:view-box;transform-origin:112px 90px;animation:flap .5s ease-in-out infinite}
.fly .wing-back{transform-box:view-box;transform-origin:120px 86px;animation:flapb .5s ease-in-out infinite}
.fly .scarf{transform-box:view-box;transform-origin:100px 96px;animation:scarf .7s ease-in-out infinite}
.fly .eyes{transform-box:view-box;transform-origin:74px 62px;animation:eyes 6s ease-in-out infinite}
.fly .brows{animation:brows 6s ease-in-out infinite}
.fly .beak-low{transform-box:view-box;transform-origin:46px 79px;animation:beak 6s ease-in-out infinite}
.fly .bang{transform-box:view-box;transform-origin:-4px 6px;animation:bang 6s ease-in-out infinite}
@media (prefers-reduced-motion: reduce){.fly,.fly .wing,.fly .wing-back,.fly .scarf,.fly .eyes,.fly .brows,.fly .beak-low,.fly .bang{animation:none}.fly .bang{opacity:0}}
